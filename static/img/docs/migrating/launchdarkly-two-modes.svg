<svg viewBox="0 0 1200 940" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img" aria-label="Diagram: two ways to run the migration. Free mode: qfg migrate pulls LaunchDarkly into a git repo you own, your server-side SDK reads it straight from disk, and your coding agents read and write the flag JSON directly — no account, no bill. Cloud mode: the same command with --push keeps that same git repo and syncs it to Quonfig Cloud, which delivers instant updates to every SDK over SSE.">
  <defs>
    <marker id="mArrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#52525b"/>
    </marker>
    <marker id="mArrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#047857"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="938" rx="16" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>

  <!-- Row A: free / local -->
  <text x="60" y="76" font-size="24" font-weight="700" fill="#18181b">Free mode: a git repo you own, read from disk</text>
  <text x="60" y="106" font-size="19" fill="#71717a">no account, no server, no bill — the migrator writes files, your SDK and your agents use them</text>

  <rect x="50" y="180" width="150" height="70" rx="12" fill="#fafafa" stroke="#d4d4d8" stroke-width="2"/>
  <text x="125" y="210" font-size="15" font-weight="600" fill="#52525b" text-anchor="middle">LaunchDarkly</text>
  <text x="125" y="232" font-size="12" fill="#a1a1aa" text-anchor="middle">their cloud</text>

  <line x1="200" y1="215" x2="232" y2="215" stroke="#52525b" stroke-width="2.5" marker-end="url(#mArrow)"/>

  <rect x="240" y="197" width="320" height="36" rx="8" fill="#3f3f46"/>
  <text x="400" y="220" font-size="14" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">qfg migrate --from launchdarkly</text>

  <line x1="560" y1="215" x2="592" y2="215" stroke="#52525b" stroke-width="2.5" marker-end="url(#mArrow)"/>

  <rect x="600" y="155" width="230" height="120" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <text x="620" y="182" font-size="14" fill="#a1a1aa">your git repo</text>
  <text x="620" y="209" font-size="13" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">feature-flags/*.json</text>
  <text x="620" y="231" font-size="13" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">segments/*.json</text>
  <text x="620" y="253" font-size="13" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MIGRATION_REPORT.md</text>

  <line x1="830" y1="215" x2="932" y2="215" stroke="#52525b" stroke-width="2.5" marker-end="url(#mArrow)"/>
  <text x="881" y="197" font-size="13" font-style="italic" fill="#71717a" text-anchor="middle">reads from disk</text>

  <rect x="940" y="155" width="210" height="150" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <text x="960" y="182" font-size="14" fill="#a1a1aa">your server</text>
  <rect x="956" y="196" width="178" height="72" rx="8" fill="#fafafa" stroke="#d4d4d8" stroke-width="2"/>
  <text x="972" y="220" font-size="13" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">quonfig-sdk</text>
  <rect x="966" y="230" width="158" height="28" rx="6" fill="#3f3f46"/>
  <text x="1045" y="249" font-size="12" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">datadir: './repo'</text>
  <text x="960" y="290" font-size="13" font-style="italic" fill="#71717a">works offline, $0</text>

  <rect x="270" y="315" width="230" height="84" rx="12" fill="#fafafa" stroke="#d4d4d8" stroke-width="2"/>
  <text x="290" y="343" font-size="15" font-weight="600" fill="#52525b">your coding agents</text>
  <text x="290" y="367" font-size="13" fill="#52525b">read &amp; write the flag JSON</text>
  <text x="290" y="388" font-size="13" font-style="italic" fill="#71717a">no API — it&#8217;s just git</text>

  <line x1="455" y1="313" x2="635" y2="277" stroke="#52525b" stroke-width="2.5" marker-start="url(#mArrow)" marker-end="url(#mArrow)"/>

  <line x1="60" y1="444" x2="1140" y2="444" stroke="#e4e4e7" stroke-width="2"/>

  <!-- Row B: cloud / real-time -->
  <text x="60" y="510" font-size="24" font-weight="700" fill="#18181b">Cloud mode: same repo, synced, live updates</text>
  <text x="60" y="540" font-size="19" fill="#71717a">add <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">--push</tspan> — you keep the git repo, plus the UI, change review, and instant delivery</text>

  <rect x="50" y="610" width="150" height="70" rx="12" fill="#fafafa" stroke="#d4d4d8" stroke-width="2"/>
  <text x="125" y="640" font-size="15" font-weight="600" fill="#52525b" text-anchor="middle">LaunchDarkly</text>
  <text x="125" y="662" font-size="12" fill="#a1a1aa" text-anchor="middle">their cloud</text>

  <line x1="200" y1="645" x2="232" y2="645" stroke="#52525b" stroke-width="2.5" marker-end="url(#mArrow)"/>

  <rect x="240" y="627" width="320" height="36" rx="8" fill="#3f3f46"/>
  <text x="400" y="649" font-size="13" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">qfg migrate --from launchdarkly --push</text>

  <line x1="560" y1="645" x2="592" y2="645" stroke="#52525b" stroke-width="2.5" marker-end="url(#mArrow)"/>

  <rect x="600" y="585" width="230" height="120" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <text x="620" y="612" font-size="14" fill="#a1a1aa">your git repo</text>
  <text x="620" y="639" font-size="13" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">feature-flags/*.json</text>
  <text x="620" y="661" font-size="13" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">segments/*.json</text>
  <text x="620" y="683" font-size="13" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MIGRATION_REPORT.md</text>

  <text x="860" y="630" font-size="13" font-style="italic" fill="#71717a">still a proper repo you own —</text>
  <text x="860" y="653" font-size="13" font-style="italic" fill="#71717a">clone it, grep it, revert it</text>

  <rect x="270" y="745" width="230" height="84" rx="12" fill="#fafafa" stroke="#d4d4d8" stroke-width="2"/>
  <text x="290" y="773" font-size="15" font-weight="600" fill="#52525b">your coding agents</text>
  <text x="290" y="797" font-size="13" fill="#52525b">read &amp; write the flag JSON</text>
  <text x="290" y="818" font-size="13" font-style="italic" fill="#71717a">no API — it&#8217;s just git</text>

  <line x1="455" y1="743" x2="635" y2="707" stroke="#52525b" stroke-width="2.5" marker-start="url(#mArrow)" marker-end="url(#mArrow)"/>

  <line x1="715" y1="713" x2="715" y2="757" stroke="#52525b" stroke-width="2.5" marker-start="url(#mArrow)" marker-end="url(#mArrow)"/>
  <text x="730" y="740" font-size="13" font-style="italic" fill="#71717a">synced</text>

  <rect x="600" y="765" width="230" height="110" rx="12" fill="#ffffff" stroke="#047857" stroke-width="2.5"/>
  <text x="620" y="792" font-size="13" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">app.quonfig.com</text>
  <text x="620" y="818" font-size="17" font-weight="700" fill="#18181b">Quonfig Cloud</text>
  <text x="620" y="843" font-size="13" fill="#52525b">UI · change review · history</text>
  <text x="620" y="864" font-size="13" fill="#52525b">SSE delivery</text>

  <line x1="830" y1="820" x2="932" y2="820" stroke="#047857" stroke-width="2.5" marker-end="url(#mArrowGreen)"/>
  <text x="881" y="791" font-size="13" font-style="italic" fill="#047857" text-anchor="middle">instant updates</text>
  <text x="881" y="847" font-size="13" font-style="italic" fill="#047857" text-anchor="middle">over SSE</text>

  <rect x="940" y="760" width="210" height="150" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <text x="960" y="787" font-size="14" fill="#a1a1aa">your servers &amp; browsers</text>
  <rect x="956" y="801" width="178" height="72" rx="8" fill="#fafafa" stroke="#d4d4d8" stroke-width="2"/>
  <text x="972" y="825" font-size="13" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">quonfig-sdk</text>
  <rect x="966" y="835" width="158" height="28" rx="6" fill="#3f3f46"/>
  <text x="1045" y="854" font-size="12" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sdkKey: 'qf_…'</text>
  <text x="960" y="895" font-size="13" font-style="italic" fill="#047857">flag flips land in ms</text>
</svg>
